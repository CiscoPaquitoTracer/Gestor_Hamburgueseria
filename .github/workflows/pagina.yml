# Publica la página de descarga (pagina/) en GitHub Pages cuando cambia en main.
# La versión y el enlace del APK los toma la propia página del último release, así que
# un release nuevo no necesita volver a publicarla.
name: Página de descarga

on:
  push:
    branches: [main]
    paths: ["pagina/**", ".github/workflows/pagina.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pagina
      - id: despliegue
        uses: actions/deploy-pages@v4
