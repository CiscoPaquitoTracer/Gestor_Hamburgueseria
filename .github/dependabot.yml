# Versionamiento de dependencias: Dependabot abre un PR cada semana
# cuando sale una versión nueva (o un parche de seguridad) de una librería o de una Action.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-y-build:
        patterns: ["org.jetbrains.kotlin*", "com.android.*", "com.google.devtools.ksp*"]
    labels: ["dependencias"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencias", "ci"]

  # Imágenes de CI. Dependabot actualiza el FROM, pero NO los ARG del SDK de ci/Dockerfile
  # (ANDROID_COMPILE_SDK / ANDROID_BUILD_TOOLS): esos se cambian a mano cuando cambie compileSdk.
  - package-ecosystem: "docker"
    directory: "/ci"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencias", "ci"]

  - package-ecosystem: "docker"
    directory: "/infra/jenkins"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencias", "ci"]
